name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  cpp-tests:
    name: C++ Tests (${{ matrix.os }}, Release)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMINIMAX_CPPPY_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  cpp-tests-debug:
    name: C++ Tests (ubuntu-latest, Debug asserts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build-debug -DCMAKE_BUILD_TYPE=Debug -DMINIMAX_CPPPY_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-debug --parallel

      - name: Test
        run: ctest --test-dir build-debug --output-on-failure

  cpp-sanitizers:
    name: C++ Tests (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DMINIMAX_CPPPY_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure

  python-tests:
    name: Python Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install . numpy pytest

      - name: Test
        run: pytest tests/python -v

  wheel-smoke-test:
    name: Wheel build + install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir wheelhouse

      - name: Install wheel into a fresh venv and smoke test
        shell: bash
        run: |
          python -m venv smoke_venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source smoke_venv/Scripts/activate
          else
            source smoke_venv/bin/activate
          fi
          python -m pip install --upgrade pip
          pip install numpy wheelhouse/*.whl
          python -c "
          import minimax_cpppy as mm
          expon, weight, errmax = mm.laplace_minimax(5, 1.0, 100.0)
          assert len(expon) == 5 and len(weight) == 5
          assert errmax > 0.0
          print('wheel smoke test ok, errmax =', errmax)
          "
